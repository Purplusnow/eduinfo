name: 수집 · 빌드 · 배포

on:
  schedule:
    # 3시간마다(UTC 기준 17분). KST로 00:17, 03:17, … 21:17
    - cron: '17 */3 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_digest:
        description: '주간 브리핑을 지금 강제로 생성'
        type: boolean
        default: false

permissions:
  contents: write # 수집한 데이터를 저장소에 커밋
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      message: ${{ steps.commit.outputs.message }}
    env:
      SUMMARY_FILE: /tmp/eduinfo-summary.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 정보 수집
        # 일부 출처가 실패해도 기존 데이터로 빌드·배포를 이어간다
        run: npm run collect
        continue-on-error: true
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}

      - name: 대학 정보 수집(대학알리미, 하루 호출 한도 안에서 누적)
        run: node collectors/universities.mjs
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}

      - name: 주간 브리핑 작성(월요일, 키가 있을 때만)
        run: npm run digest -- ${{ inputs.force_digest && '--force' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 수집 상태 점검 · 텔레그램 알림
        # 출처가 24시간 넘게 실패하거나 0건이면 한 번, 복구되면 한 번 알린다(horseai와 같은 봇·채팅)
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_STATUS_URL: https://edu.koreanblog.xyz/status/
        run: |
          BODY=$(node collectors/health.mjs)
          [ -n "$BODY" ] || { echo "상태 변화 없음"; exit 0; }
          echo "$BODY"
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "텔레그램 설정 없음 — 넘어간다"; exit 0; }
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=$(printf '%s\n\n%s' "$BODY" "$SITE_STATUS_URL")" \
            -o /dev/null -w "  텔레그램 %{http_code}\n" || true

      - name: 수집 결과 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data src/content/digests
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 자동 수집"
            git pull --rebase --autostash
            git push
            # 새 글이 있으면 배포 성공 뒤 보낼 텔레그램 메시지를 만들어 둔다
            MSG=$(node collectors/notify-summary.mjs || true)
            if [ -n "$MSG" ]; then
              { echo 'message<<__MSG__'; echo "$MSG"; echo '__MSG__'; } >> "$GITHUB_OUTPUT"
            fi
          fi

      - id: pages
        uses: actions/configure-pages@v6

      - name: 사이트 빌드
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 빌드·배포가 실패하면 바로 알린다(수집 장애는 위 점검 단계가 따로 알림)
  notify-failure:
    needs: [collect-and-build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "텔레그램 설정 없음"; exit 0; }
          NOW=$(TZ=Asia/Seoul date '+%m/%d %H:%M')
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=$(printf '[입시정보] %s 빌드·배포 실패\n사이트가 갱신되지 않았습니다.\n\n%s' "$NOW" "$RUN_URL")" \
            -o /dev/null -w "  텔레그램 %{http_code}\n" || true

  # 새 글이 들어와 배포까지 끝나면 요약을 보낸다(바뀐 게 없으면 조용히 넘어감)
  notify-success:
    needs: [collect-and-build, deploy]
    if: success() && needs.collect-and-build.outputs.message != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BODY: ${{ needs.collect-and-build.outputs.message }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "텔레그램 설정 없음"; exit 0; }
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${BODY}" \
            -o /dev/null -w "  텔레그램 %{http_code}\n" || true
